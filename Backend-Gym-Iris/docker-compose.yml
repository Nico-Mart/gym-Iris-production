version: "3.8"

services:
  # Servicio de MySQL
  db:
    image: mysql:8.0
    container_name: gymiris_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gymiris_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio del Backend .NET
  backend:
    build:
      context: ./Backend-Gym-Iris
      dockerfile: DockerFile
    container_name: gymiris_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymiris_network

volumes:
  mysql_data:
    driver: local

networks:
  gymiris_network:
    driver: bridge
